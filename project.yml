name: LocalGemma
options:
  bundleIdPrefix: com.matha
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  LiteRTLM:
    path: Vendor/LiteRTLM
  LocalGemmaDispatch:
    path: DispatchSystem
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.12.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  LocalGemma:
    type: application
    platform: iOS
    sources:
      - path: LocalGemma
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - package: LocalGemmaDispatch
        product: DispatchUI
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matha.atlas
        PRODUCT_NAME: MathaAtlas
        INFOPLIST_KEY_CFBundleDisplayName: Matha Atlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: LocalGemma/Resources/Info.plist
      properties:
        CFBundleDisplayName: Matha Atlas
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Matha Atlas uses the camera only when you choose to attach a photo to an on-device conversation.
        NSMicrophoneUsageDescription: Matha Atlas uses the microphone only when you record audio for the on-device model to analyze.
        NSPhotoLibraryUsageDescription: Matha Atlas accesses only the photos and videos you select to attach to an on-device conversation.
        NSRemindersFullAccessUsageDescription: Matha Atlas accesses Reminders only when you approve a tool request to create a reminder.
        NSLocalNetworkUsageDescription: Matha Atlas connects to MCP servers and paired desktop agents on your network only when you ask it to.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.matha.atlas.dispatch
            CFBundleURLSchemes:
              - mathaatlas
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
